<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Оплата</title>
    <link rel="stylesheet" href="pay.css">
</head>

<body>

<div class="pay-container">

<h2>💳 Оплата заказа</h2>

<input type="text" placeholder="Номер карты"><br>
<input type="text" placeholder="Имя владельца"><br>
<input type="text" placeholder="MM/YY"><br>
<input type="text" placeholder="CVV"><br>

<button onclick="pay()">Оплатить</button>

</div>

<script>
function pay(){
    alert("Оплата прошла успешно!");
    localStorage.removeItem("cart");
    window.location.href = "index.html";
}
</script>

<script>
function pay(){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(cart.length === 0){
        alert("Корзина пуста!");
        return;
    }

    let total = 0;
    let items = "";

    for(let i=0;i<cart.length;i++){
        items += cart[i].name + " ";
        total += cart[i].price;
    }

    fetch("/cgi-bin/save_order.py", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "items=" + items + "&total=" + total
    })
    .then(() => {
        alert("Оплата успешна!");
        localStorage.removeItem("cart");
        window.location.href = "index.html";
    });
}
</script>


</body>
</html>
