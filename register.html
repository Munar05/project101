<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
<link rel="stylesheet" href="auth.css">
</head>
<form action="/cgi-bin/register.py" method="post" onsubmit="return validateForm()">


<script>
function validateForm(){
    let login = document.querySelector("input[name='login']").value;
    let pass = document.querySelector("input[name='pass']").value;

    if(login.length < 3){
        alert("Логин слишком короткий");
        return false;
    }

    if(pass.length < 3){
        alert("Пароль слишком короткий");
        return false;
    }

    return true;
}
</script>


<body>

<div class="container">

<header>Регистрация</header>

<form action="/cgi-bin/register.py" method="post">
    <input type="text" name="login" placeholder="Логин">
    <input type="password" name="pass" placeholder="Пароль">
    <input type="submit" value="Зарегистрироваться">
</form>

<a href="login.html">Уже есть аккаунт? Войти</a>

</div>

</body>
</html>
